<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7D0000">
  <title>KSUCflow | Password access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--brand:#7D0000;--dark:#5D0000;--ink:#202B3C;--muted:#718096;--line:#E5EAF0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#faf8f8,#f7eeee);font:14px "DM Sans",Arial,sans-serif;color:var(--ink)}
    main{width:min(460px,100%);padding:34px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(24,36,53,.1)}
    .brand{display:flex;align-items:center;gap:11px;margin-bottom:30px;font-size:21px;font-weight:700}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--brand);color:white;font:700 23px Georgia,serif}.brand span:last-child span{color:var(--brand)}
    .eyebrow{margin:0 0 8px;color:var(--brand);font-size:10px;font-weight:700;letter-spacing:1.4px}h1{margin:0 0 10px;font:700 28px/1.2 "Playfair Display",Georgia,serif}p{font-size:12px;line-height:1.7;color:var(--muted)}
    label{display:block;margin-top:18px;color:#465468;font-size:11px;font-weight:700}input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #dfe5ec;border-radius:8px;font:13px "DM Sans",Arial,sans-serif;outline-color:var(--brand)}
    button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--brand);color:white;font-weight:700;cursor:pointer}button:hover{background:var(--dark)}button:disabled{opacity:.6;cursor:wait}
    .message{min-height:20px;color:var(--brand);font-size:12px;overflow-wrap:anywhere}.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}.links a{color:var(--brand);font-size:11px;font-weight:700;text-decoration:none}
    [hidden]{display:none!important}@media(max-width:420px){main{padding:26px 21px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">K</span><span>KSUC<span>flow</span></span></div>
    <p class="eyebrow">SECURE ACCOUNT ACCESS</p>
    <section id="requestSection">
      <h1>Reset your password</h1>
      <p>Enter your KSUCflow account email. If the account is registered, Supabase will send a secure link to continue.</p>
      <form id="requestForm">
        <label>Email address<input id="recoveryEmail" type="email" required autocomplete="email" placeholder="name@ksuc.ac.ke"></label>
        <button id="requestButton" type="submit">Send reset link</button>
      </form>
    </section>
    <section id="updateSection" hidden>
      <h1>Choose a new password</h1>
      <p>Use at least 8 characters. After updating it, sign in again using the correct portal.</p>
      <form id="updateForm">
        <label>New password<input id="newPassword" type="password" required minlength="8" autocomplete="new-password"></label>
        <label>Confirm password<input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label>
        <button id="updateButton" type="submit">Update password</button>
      </form>
    </section>
    <p class="message" id="message" role="status" aria-live="polite"></p>
    <div class="links"><a href="login.html">Staff login</a><a href="admin-login.html">Admin login</a></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    (async function () {
      const byId = id => document.getElementById(id);
      const client = window.ksucSupabase;
      if (!client) { byId('message').textContent = 'The sign-in service could not start. Refresh this page or contact ICT.'; return; }
      const requestSection = byId('requestSection');
      const updateSection = byId('updateSection');
      const message = byId('message');
      try {
        const result = await client.auth.getSession();
        if (result.error) throw result.error;
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const type = hash.get('type');
        if ((result.data && result.data.session) || ['recovery', 'invite', 'signup', 'magiclink'].includes(type)) {
          updateSection.hidden = false;
          requestSection.hidden = true;
        }
      } catch (error) {
        message.textContent = error.message || 'Could not verify the password link. Request a new one.';
      }

      byId('requestForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        const button = byId('requestButton');
        button.disabled = true; button.textContent = 'Sending…'; message.textContent = '';
        try {
          const email = byId('recoveryEmail').value.trim().toLowerCase();
          const redirectTo = new URL('/password-reset.html', window.location.origin).href;
          const result = await client.auth.resetPasswordForEmail(email, { redirectTo });
          if (result.error) throw result.error;
          message.textContent = 'If the account exists, a reset link has been sent. Check your inbox and spam folder.';
        } catch (error) {
          message.textContent = error.message || 'Could not send the reset email. Please try later.';
        } finally { button.disabled = false; button.textContent = 'Send reset link'; }
      });

      byId('updateForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        const button = byId('updateButton');
        const password = byId('newPassword').value;
        if (password !== byId('confirmPassword').value) { message.textContent = 'The passwords do not match.'; return; }
        if (password.length < 8) { message.textContent = 'Use at least 8 characters.'; return; }
        button.disabled = true; button.textContent = 'Updating…'; message.textContent = '';
        try {
          const result = await client.auth.updateUser({ password });
          if (result.error) throw result.error;
          await client.auth.signOut();
          byId('updateForm').reset();
          message.textContent = 'Password updated successfully. Choose the appropriate login portal above.';
          updateSection.hidden = true; requestSection.hidden = true;
        } catch (error) {
          message.textContent = error.message || 'Could not update the password. Request a fresh link and try again.';
        } finally { button.disabled = false; button.textContent = 'Update password'; }
      });
    })();
  </script>
</body>
</html>
