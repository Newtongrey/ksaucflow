
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KSUCflow - Supabase Connection Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #252525;
      margin: 0;
      padding: 32px 16px;
    }
    main {
      max-width: 480px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 6px 24px #00000012;
    }
    h1 { color: #7D0000; font-size: 23px; }
    label { display: block; margin-top: 16px; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }
    button {
      margin-top: 18px;
      padding: 12px 16px;
      background: #7D0000;
      color: white;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      width: 100%;
    }
    #result {
      margin-top: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
<main>
  <h1>KSUCflow Connection Test</h1>
  <p>Sign in using a pilot test account to verify the database connection.</p>

  <form id="testForm">
    <label for="email">Pilot test email</label>
    <input id="email" type="email" required autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" required
           autocomplete="current-password">

    <button type="submit">Test Supabase Connection</button>
  </form>

  <div id="result" role="status" aria-live="polite"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://smceytzmtqdtjnyhhwlr.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_StUsiALTcdgAXXDQEN0AgA_SeKUz55b';

  const result = document.getElementById('result');
  const form = document.getElementById('testForm');

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    result.textContent = 'Connecting...';

    try {
      const { data: login, error: loginError } =
        await client.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

      if (loginError) throw loginError;

      const { data: departments, error: dbError } =
        await client
          .from('departments')
          .select('name')
          .order('name');

      if (dbError) throw dbError;

      result.textContent =
        'SUCCESS: Signed in as ' + login.user.email +
        '\nDatabase access confirmed.' +
        '\nDepartments: ' +
        departments.map(d => d.name).join(', ');

    } catch (error) {
      result.textContent =
        'Connection test failed: ' + error.message;
    }
  });
</script>
</body>
</html>
